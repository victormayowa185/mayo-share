<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>MAYO Share - P2P Transfer</title>
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>
  <h1>MAYO Share</h1>

  <!-- ========== HOTSPOT SECTION ========== -->
  <div class="section">
    <h3>Hotspot</h3>
    <button id="startHotspotBtn">Start Hotspot</button>
    <div id="hotspotStatus" style="margin-top:10px;"></div>
  </div>

     <!-- ========== P2P SESSION SECTION ========== -->
  <div class="section">
    <h3>P2P Session</h3>
    <div id="sessionArea">
      <button id="createSessionBtn">Create Session</button>
      <div id="offerDisplay" class="hidden">
        <p>Your session code (share with partner):</p>
        <div id="offerCode" class="code-display"></div>
        <div id="offerQr"></div>
        <p>Enter partner's answer code:</p>
        <input type="text" id="answerCodeInput" placeholder="Paste answer code here">
        <button id="submitAnswerBtn">Submit Answer</button>
      </div>

      <button id="joinSessionBtn">Join Session</button>
      <div id="joinDisplay" class="hidden">
        <p>Enter partner's offer code:</p>
        <input type="text" id="offerCodeInput" placeholder="Paste offer code here">
        <button id="processOfferBtn">Process Offer</button>
        <div id="answerDisplay" class="hidden">
          <p>Your answer code (give back to partner):</p>
          <div id="answerCode" class="code-display"></div>
          <div id="answerQr"></div>
        </div>
      </div>
    </div>
    <div id="sessionStatus" style="margin-top:10px; color: #0f0;"></div>

    <!-- File sharing via P2P (with queue) -->
    <div id="p2pFileArea" class="hidden">
      <hr>
      <button id="addFileToQueueBtn">Add Files</button>
      <button id="sendAllBtn" disabled>Send All</button>
      <div id="fileQueueContainer" style="margin-top:10px;"></div>
      <div id="receiveFiles" class="hidden">
        <p>Receiving files…</p>
        <div id="incomingFiles"></div>
      </div>
    </div>
  </div>

  <!-- ========== HTTP SHARE SECTION ========== -->
  <div class="section">
    <h3>HTTP Share</h3>
    <div>
      <button id="selectFileBtn">Select File</button>
      <span id="selectedFileName" style="margin-left:10px;">No file chosen</span>
    </div>
    <button id="startServerBtn" disabled>Start Sharing</button>
    <button id="stopServerBtn" disabled>Stop Sharing</button>
    <div id="shareUrl"></div>
    <div id="qrContainer" style="display: none;">
      <img id="qrCodeImg" alt="QR Code"><br>
      <button id="copyLinkBtn" class="copy-btn">Copy Link</button>
    </div>
    <!-- Download status indicator -->
    <div id="downloadStatus" class="hidden" style="margin-top:15px; text-align:center;">
      <div id="spinner" class="spinner"></div>
      <div id="checkmark" class="checkmark hidden">✔</div>
      <div id="downloadText" style="color:#aaa; margin-top:5px;">Waiting for receiver...</div>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

  <script>
    // ---------- GLOBALS ----------
    let selectedFilePath = null;         // for HTTP server
    let currentShareUrl = null;
    let isDownloading = false;

    // P2P globals
    let localPC = null;
    let localDC = null;
    let fileQueue = [];                // [{ id, name, path, size, status, progress }]
    let currentSendId = null;
    let isSending = false;

    // Receiver state: map transfer id -> { name, size, path, received, progress element }
    const receiveMap = {};

    // ---------- UTILS ----------
    function el(id) { return document.getElementById(id); }
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // ========== 1. HOTSPOT ==========
    el('startHotspotBtn').addEventListener('click', async () => {
      const statusDiv = el('hotspotStatus');
      statusDiv.textContent = 'Starting hotspot...';
      try {
        const result = await window.electronAPI.startHotspot();
        statusDiv.textContent = result;
      } catch (error) {
        statusDiv.textContent = 'Error: ' + error;
      }
    });

    // ========== 2. HTTP FILE SERVER ==========
    const dropArea = document.body;
    dropArea.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); });
    dropArea.addEventListener('drop', async (e) => {
      e.preventDefault(); e.stopPropagation();
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        const filePath = files[0].path;
        selectedFilePath = filePath;
        const fileName = files[0].name;
        el('selectedFileName').textContent = fileName;
        const size = await window.electronAPI.getFileSize(filePath);
        el('selectedFileName').textContent += ` (${formatBytes(size)})`;
        el('startServerBtn').disabled = false;
      }
    });

    el('selectFileBtn').addEventListener('click', async () => {
      const filePath = await window.electronAPI.selectFile();
      if (filePath) {
        selectedFilePath = filePath;
        const fileName = filePath.split('\\').pop();
        el('selectedFileName').textContent = fileName;
        const size = await window.electronAPI.getFileSize(filePath);
        el('selectedFileName').textContent += ` (${formatBytes(size)})`;
        el('startServerBtn').disabled = false;
      }
    });

    el('startServerBtn').addEventListener('click', async () => {
      if (!selectedFilePath) return;
      const urlDiv = el('shareUrl');
      try {
        const url = await window.electronAPI.startFileServer(selectedFilePath);
        currentShareUrl = url;
        urlDiv.innerHTML = `Share this link: <a href="${url}" target="_blank">${url}</a>`;
        el('stopServerBtn').disabled = false;
        el('startServerBtn').disabled = true;
        el('downloadStatus').classList.remove('hidden');
        el('spinner').classList.remove('hidden');
        el('checkmark').classList.add('hidden');
        el('downloadText').textContent = 'Waiting for receiver...';
        if (typeof QRCode !== 'undefined') {
          QRCode.toDataURL(url, { width: 250, margin: 2 }, (err, dataURL) => {
            if (!err) {
              el('qrCodeImg').src = dataURL;
              el('qrContainer').style.display = 'block';
            }
          });
        }
      } catch (err) {
        urlDiv.textContent = 'Error: ' + err;
      }
    });

    el('stopServerBtn').addEventListener('click', async () => {
      await window.electronAPI.stopFileServer();
      el('shareUrl').textContent = '';
      el('stopServerBtn').disabled = true;
      el('startServerBtn').disabled = false;
      el('qrContainer').style.display = 'none';
      currentShareUrl = null;
      el('downloadStatus').classList.add('hidden');
      isDownloading = false;
    });

    el('copyLinkBtn').addEventListener('click', () => {
      if (!currentShareUrl) return;
      navigator.clipboard.writeText(currentShareUrl).then(() => {
        alert('Link copied to clipboard!');
      }).catch(() => {
        alert('Failed to copy link. Please copy manually.');
      });
    });

    window.electronAPI.onDownloadUpdate((status) => {
      if (status === 'started') {
        isDownloading = true;
        el('spinner').classList.remove('hidden');
        el('checkmark').classList.add('hidden');
        el('downloadText').textContent = 'Sending file...';
      } else if (status === 'completed') {
        isDownloading = false;
        el('spinner').classList.add('hidden');
        el('checkmark').classList.remove('hidden');
        el('downloadText').textContent = 'Download complete!';
      }
    });

    // ========== 3. P2P SESSION (WebRTC) + FILE QUEUE ==========

    // --- Queue UI helpers ---
    function renderQueue() {
      const container = el('fileQueueContainer');
      container.innerHTML = '';
      fileQueue.forEach((file, idx) => {
        const div = document.createElement('div');
        div.className = 'queue-item';
        div.innerHTML = `
        <span>${file.name} (${formatBytes(file.size)})</span>
        <span>${file.status === 'transferring' ? ` ${Math.round(file.progress)}%` : ` [${file.status}]`}</span>
        <button data-idx="${idx}" class="removeFileBtn" ${file.status === 'transferring' ? 'disabled' : ''}>❌</button>
      `;
        container.appendChild(div);
      });
      el('sendAllBtn').disabled = fileQueue.length === 0 || isSending;
    }

    function resetDoneQueue() {
      if (!isSending && fileQueue.length > 0 && fileQueue.every(f => f.status === 'done' || f.status === 'cancelled')) {
        fileQueue = [];
        renderQueue();
      }
    }

    // --- Data channel message handler (full receive) ---
    async function handleDataChannelMessage(raw) {
      if (typeof raw !== 'string') return;
      let msg;
      try {
        msg = JSON.parse(raw);
      } catch (e) {
        return;
      }

      switch (msg.type) {
        case 'file-start': {
          const { id, name, size } = msg;
          const savePath = `C:\\mayo-received\\${name}`;
          await window.electronAPI.createReceiveFile(savePath);
          receiveMap[id] = { name, size, path: savePath, received: 0 };

          const fileDiv = document.createElement('div');
          fileDiv.id = `recv-${id}`;
          fileDiv.innerHTML = `
          <span>${name}</span>
          <progress id="prog-${id}" value="0" max="${size}"></progress>
          <span id="pct-${id}">0%</span>
        `;
          el('incomingFiles').appendChild(fileDiv);
          break;
        }
        case 'file-chunk': {
          const { id, data, offset, totalSize } = msg;
          if (!receiveMap[id]) return;
          await window.electronAPI.appendReceiveChunk(receiveMap[id].path, data);
          receiveMap[id].received += (offset + data.length > receiveMap[id].received ? (offset + data.length) - receiveMap[id].received : data.length); // rough
          // Actually chunk size = data decoded length, we can approximate: after append, the file size increases
          // We'll use the offset from the message: the data length in bytes after base64 decode
          const chunkBytes = (data.length * 3) / 4; // rough estimate, but better to use actual decoded length
          // Let's improve: decode base64 to get actual byte size
          const decodedLen = atob(data).length;
          receiveMap[id].received = offset + decodedLen;
          const pct = Math.round((receiveMap[id].received / totalSize) * 100);
          const progEl = document.getElementById(`prog-${id}`);
          const pctEl = document.getElementById(`pct-${id}`);
          if (progEl) progEl.value = receiveMap[id].received;
          if (pctEl) pctEl.textContent = pct + '%';
          break;
        }
        case 'file-end': {
          const { id } = msg;
          if (receiveMap[id]) {
            el('sessionStatus').textContent = `File received: ${receiveMap[id].name}`;
            delete receiveMap[id];
          }
          break;
        }
        case 'file-cancel': {
          const { id } = msg;
          if (receiveMap[id]) {
            delete receiveMap[id];
            // Optionally remove the UI element
            const div = document.getElementById(`recv-${id}`);
            if (div) div.remove();
          }
          break;
        }
      }
    }

    // --- Create Session (Offerer) ---
    el('createSessionBtn').addEventListener('click', async () => {
      try {
        localPC = new RTCPeerConnection();
        localPC.addEventListener('iceconnectionstatechange', () => {
          console.log('ICE state:', localPC.iceConnectionState);
          if (localPC.iceConnectionState === 'connected' || localPC.iceConnectionState === 'completed') {
            el('sessionStatus').textContent = 'Connected! Data channel open.';
            el('p2pFileArea').classList.remove('hidden');
          }
        });

        localDC = localPC.createDataChannel('mayo-share', { ordered: true });
        localDC.onopen = () => {
          el('sessionStatus').textContent = 'Connected! Data channel open.';
          el('p2pFileArea').classList.remove('hidden');
        };
        localDC.onmessage = (e) => handleDataChannelMessage(e.data);

        const offer = await localPC.createOffer();
        await localPC.setLocalDescription(offer);

        await Promise.race([
          new Promise(resolve => {
            if (localPC.iceGatheringState === 'complete') resolve(null);
            else {
              localPC.addEventListener('icegatheringstatechange', () => {
                if (localPC.iceGatheringState === 'complete') resolve(null);
              });
              if (localPC.iceGatheringState === 'complete') resolve(null);
            }
          }),
          new Promise(resolve => setTimeout(() => resolve('timeout'), 10000))
        ]);

        const compactOffer = await window.electronAPI.compressSDP(localPC.localDescription.sdp);
        el('offerCode').textContent = compactOffer;
        el('offerDisplay').classList.remove('hidden');
        el('createSessionBtn').disabled = true;

        QRCode.toDataURL(compactOffer, { width: 200, margin: 2 }, (err, dataURL) => {
          if (!err) el('offerQr').innerHTML = `<img src="${dataURL}" alt="Offer QR">`;
        });
      } catch (err) {
        el('sessionStatus').textContent = 'Error creating session: ' + err.message;
      }
    });

    // --- Submit Answer (Offerer side) ---
    el('submitAnswerBtn').addEventListener('click', async () => {
      const answerCompact = el('answerCodeInput').value.trim();
      if (!answerCompact) return;
      try {
        const answerSDP = await window.electronAPI.decompressSDP(answerCompact);
        await localPC.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answerSDP }));
        el('sessionStatus').textContent = 'Answer accepted – connection should open soon.';
      } catch (err) {
        el('sessionStatus').textContent = 'Invalid answer: ' + err.message;
      }
    });

    // --- Join Session (Receiver) ---
    el('joinSessionBtn').addEventListener('click', () => {
      el('joinDisplay').classList.remove('hidden');
      el('joinSessionBtn').disabled = true;
    });

    el('processOfferBtn').addEventListener('click', async () => {
      const offerCompact = el('offerCodeInput').value.trim();
      if (!offerCompact) return;
      try {
        const offerSDP = await window.electronAPI.decompressSDP(offerCompact);
        localPC = new RTCPeerConnection();

        localPC.ondatachannel = (event) => {
          localDC = event.channel;
          localDC.onopen = () => {
            el('sessionStatus').textContent = 'Connected! Data channel open.';
            el('p2pFileArea').classList.remove('hidden');
            el('receiveFiles').classList.remove('hidden');
          };
          localDC.onmessage = (e) => handleDataChannelMessage(e.data);
        };

        await localPC.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: offerSDP }));
        const answer = await localPC.createAnswer();
        await localPC.setLocalDescription(answer);

        await Promise.race([
          new Promise(resolve => {
            if (localPC.iceGatheringState === 'complete') resolve(null);
            else {
              localPC.addEventListener('icegatheringstatechange', () => {
                if (localPC.iceGatheringState === 'complete') resolve(null);
              });
              if (localPC.iceGatheringState === 'complete') resolve(null);
            }
          }),
          new Promise(resolve => setTimeout(() => resolve('timeout'), 10000))
        ]);

        const compactAnswer = await window.electronAPI.compressSDP(localPC.localDescription.sdp);
        el('answerCode').textContent = compactAnswer;
        el('answerDisplay').classList.remove('hidden');
        el('processOfferBtn').disabled = true;

        QRCode.toDataURL(compactAnswer, { width: 200, margin: 2 }, (err, dataURL) => {
          if (!err) el('answerQr').innerHTML = `<img src="${dataURL}" alt="Answer QR">`;
        });
      } catch (err) {
        el('sessionStatus').textContent = 'Error processing offer: ' + err.message;
      }
    });

    // --- Add file to queue ---
    el('addFileToQueueBtn').addEventListener('click', async () => {
      const filePath = await window.electronAPI.selectFile();
      if (filePath) {
        const name = filePath.split('\\').pop();
        const size = await window.electronAPI.getFileSize(filePath);
        fileQueue.push({ id: Date.now().toString() + Math.random(), name, path: filePath, size, status: 'queued', progress: 0 });
        renderQueue();
      }
    });

    // --- Remove file from queue (delegate to container) ---
    el('fileQueueContainer').addEventListener('click', (e) => {
      if (e.target.classList.contains('removeFileBtn')) {
        const idx = parseInt(e.target.dataset.idx);
        const file = fileQueue[idx];
        if (file && file.status !== 'transferring') {
          fileQueue.splice(idx, 1);
          renderQueue();
        }
      }
    });

    // --- Send All ---
    el('sendAllBtn').addEventListener('click', async () => {
      if (!localDC || localDC.readyState !== 'open') {
        el('sessionStatus').textContent = 'Data channel not open.';
        return;
      }
      isSending = true;
      renderQueue();
      for (let i = 0; i < fileQueue.length; i++) {
        const file = fileQueue[i];
        if (file.status === 'done' || file.status === 'cancelled') continue;
        file.status = 'transferring';
        renderQueue();

        // Send file-start
        localDC.send(JSON.stringify({ type: 'file-start', id: file.id, name: file.name, size: file.size }));

        const CHUNK_SIZE = 64 * 1024; // 64 KB
        let offset = 0;
        while (offset < file.size) {
          const chunkSize = Math.min(CHUNK_SIZE, file.size - offset);
          const base64 = await window.electronAPI.readFileChunk(file.path, offset, chunkSize);
          localDC.send(JSON.stringify({
            type: 'file-chunk',
            id: file.id,
            data: base64,
            offset,
            totalSize: file.size
          }));
          offset += chunkSize;
          file.progress = Math.round((offset / file.size) * 100);
          renderQueue();
          await new Promise(r => setTimeout(r, 1)); // tiny yield to avoid blocking UI
        }
        // Send file-end
        localDC.send(JSON.stringify({ type: 'file-end', id: file.id }));
        file.status = 'done';
        renderQueue();
      }
      isSending = false;
      renderQueue();
      el('sessionStatus').textContent = 'All files sent!';
    });

    // Initial queue render + ensure receive directory
    renderQueue();
    // Ensure receive folder exists (just log, main process will create file on write)
    (async () => {
      // Ensure C:\mayo-received exists? The main process will create files inside; if dir missing, writeFile may fail.
      // We'll add a handler to create the directory if needed, but for now warn.
    })();

    // ---------- PING ----------
    (async () => {
      try { console.log(await window.electronAPI.ping()); } catch { }
    })();
  </script>
</body>

</html>
